lamp {
  itemName: Lamp
  variants: [ wood ]
  furniture {
    collision:half
    width: 0.5
    rotatable:true
    light {
      level = [0,5,10,15]
      y:1
    }
    sound {
      place:"block.wood.place"
      break:"block.wood.break"
    }
  }
}

